  B4:
    name: long_horizon_rollout
    status: blocked_by_B2
  B5:
    name: ablation
    status: blocked_by_B2
  B6:
    name: closed_loop_navigation
    status: blocked_by_B2
  B7:
    name: ranger_real_robot
    status: blocked_by_B6
gates:
  B1_to_B2_scale_up:
    status: blocked_by_B1
