formal:
  TopoNav_P1:
    name: static_semantic_topology_closed_loop_vlm_navigation
    status: running
    active_plan: docs/exec-plans/active/TOPONAV_HARNESS_P1.md
    branch: research/goalpose
    output: outputs/formal/TopoNav/P1
    protocol:
      fixed_tasks: 80
      task_mix: {S1_semantic_goal: 20, S2_relation_task: 30, S3_route_constrained: 30}
      scenes: [interior_0047_839892, interior_0108_839984, interior_0135_840032]
      vlm_backend: qwen3-vl:8b-instruct
      vlm_temperature: 0
      executor: fixed_Habitat_metric_executor
      online_vlm_forbidden: [metric_coordinates, navmesh, oracle_route, hidden_goal_pose]
      methods: [Direct-VLM, FullTopo-VLM, FullTopo+Validator, History-Agent, TopoNav-Harness]
    required_outputs: [vlm_cache.jsonl, benchmark_episode_results.jsonl, benchmark_summary.json, paper_assets]
    evidence_boundary: actual_Habitat_execution_logs_only

future:
  TopoNav_P2_dynamic:
    status: blocked_by_TopoNav_P1
