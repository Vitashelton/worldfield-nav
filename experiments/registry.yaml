schema_version: 1
project: TopoNav Harness
preliminary_infrastructure:
  WorldFlow_S0: {status: archived_after_research_pivot, output: outputs/exp001}
  WorldFlow_S1: {status: archived_after_research_pivot, output: outputs/exp002_counterfactual_ego_flow}
  WorldFlow_S2: {status: archived_after_research_pivot, output: outputs/exp003_transport_revelation}
  GeoAnchor_G1:
    status: completed_preliminary
    retained_value: geometry-validated cross-view audit and frozen DINO infrastructure
  GeoAnchor_G2_G3:
    status: archived_after_task_mismatch
    retained_value: code and diagnostics only; not paper evidence
  ExecField_P0:
    status: completed_preliminary
    retained_value: oracle-gap motivation on fixed ImageNav candidates
  RelationNav_P1_P2:
    status: archived_after_harness_refinement
