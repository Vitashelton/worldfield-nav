    result: docs/results/G1_CROSSVIEW_FOUNDATION_FEATURE_AUDIT.md
    decision: GO
    decision_rationale: >
      Across geometry-validated small and large view pairs, R@1 decreased
      from 0.461 to 0.056 and positive cosine similarity from 0.957 to 0.797.
      Large-view correspondences occurred in train, validation, and unseen scenes.
